name: Build

# Build only. The smoke tests need the full synced data set (a ~44 MB git clone
# plus a ~149 MB listfile, and wago.tools blocks datacentre IPs), so running
# them here would be slow and flaky. Run `npm test` locally after `sync-all`.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node-version is the Node the build runs on, and is deliberately pinned
      # to the `engines` floor in package.json — it verifies the minimum we
      # claim to support. It is unrelated to the action's own runtime, which is
      # what the "Node.js 20 is deprecated" runner warning was about.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node dist/index.js --list

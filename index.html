<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hated WoW MCP Explorer</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #181818; color: #ccc; display: flex; height: 100vh; overflow: hidden;
    }

    /* Sidebar */
    #sidebar { width: 320px; background: #202020; border-right: 1px solid #333; display: flex; flex-direction: column; }
    .header { padding: 16px; background: #181818; border-bottom: 1px solid #333; }
    .header h1 { font-size: 16px; color: #f58220; text-transform: uppercase; letter-spacing: .5px; }
    .header .sub { font-size: 11px; color: #777; margin-top: 4px; }
    .search-box { padding: 12px 16px; border-bottom: 1px solid #2a2a2a; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 8px 12px; background: #2a2a2a; border: 1px solid #3c3c3c;
      color: #fff; border-radius: 4px; font-size: 13px; outline: none; font-family: inherit;
    }
    input:focus, select:focus { border-color: #f58220; }
    .list-container { flex: 1; overflow-y: auto; padding: 8px; }
    .section-title { font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase; padding: 12px 8px 6px; }
    .item-card {
      padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-bottom: 3px;
      background: #252526; border-left: 3px solid transparent;
    }
    .item-card:hover { background: #37373d; color: #fff; }
    .item-card.active { background: #37373d; border-left-color: #f58220; color: #fff; }
    .item-card .tname { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .item-card .ttitle { font-size: 11px; color: #888; margin-top: 2px; }
    .item-card.active .ttitle { color: #aaa; }

    /* Main pane */
    #main-pane { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; min-width: 0; }
    .top-bar {
      min-height: 48px; background: #252526; border-bottom: 1px solid #333;
      display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px;
    }
    .file-path { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #9cdcfe; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button.btn {
      padding: 8px 14px; background: #f58220; border: none; color: #fff; font-weight: bold;
      border-radius: 4px; cursor: pointer; font-size: 12px; transition: background .2s; white-space: nowrap;
    }
    button.btn:hover { background: #e06d0e; }
    button.btn:disabled { background: #4a4a4a; cursor: default; }
    button.btn.secondary { background: #3c3c3c; }
    button.btn.secondary:hover { background: #4a4a4a; }

    #form-panel { padding: 14px 16px; border-bottom: 1px solid #333; background: #222; max-height: 42vh; overflow-y: auto; }
    #tool-desc { font-size: 12px; color: #999; line-height: 1.5; margin-bottom: 12px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; color: #ddd; margin-bottom: 4px; }
    .field label .req { color: #f58220; }
    .field label .opt { color: #666; font-weight: normal; }
    .field .hint { font-size: 11px; color: #777; margin-top: 3px; line-height: 1.4; }
    .field.check { display: flex; align-items: center; gap: 8px; }
    .field.check input { width: auto; }

    #editor-container { flex: 1; min-height: 0; }
    #status { font-size: 11px; color: #888; }
    #status.err { color: #f48771; }

    #toast {
      position: fixed; bottom: 20px; right: 20px; background: #4ec9b0; color: #111;
      padding: 10px 18px; border-radius: 4px; font-weight: bold; font-size: 13px;
      display: none; box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h1>Hated WoW MCP</h1>
      <div class="sub" id="toolCount">loading tools…</div>
    </div>
    <div class="search-box">
      <input type="text" id="toolFilter" placeholder="Filter tools…" autocomplete="off">
    </div>
    <div class="list-container" id="toolList"></div>
  </div>

  <div id="main-pane">
    <div class="top-bar">
      <span class="file-path" id="currentTool">Select a tool</span>
      <div class="actions">
        <span id="status"></span>
        <button class="btn secondary" onclick="copyOutput()">Copy</button>
        <button class="btn" id="runBtn" onclick="runTool()" disabled>Run</button>
      </div>
    </div>

    <div id="form-panel">
      <div id="tool-desc">Pick a tool from the left. Every query runs locally against your synced data — no model, no network.</div>
      <div id="fields"></div>
    </div>

    <div id="editor-container"></div>
  </div>

  <div id="toast">Copied to clipboard!</div>

  <script>
    const API = ""; // same origin — server.js serves this page
    let editor, tools = [], current = null;

    require.config({ paths: { vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs" } });
    require(["vs/editor/editor.main"], function () {
      editor = monaco.editor.create(document.getElementById("editor-container"), {
        value: "",
        language: "plaintext",
        theme: "vs-dark",
        automaticLayout: true,
        fontSize: 13,
        readOnly: true,
        wordWrap: "on",
        minimap: { enabled: true },
      });
      loadTools();
    });

    const GROUPS = [
      ["API reference",        (n) => n.startsWith("wow_api_")],
      ["Blizzard UI source",   (n) => n.startsWith("wow_ui_")],
      ["Authoring",            (n) => ["wow_lua_lint","wow_xml_validate","wow_toc_validate","wow_addon_scaffold","wow_install_info"].includes(n)],
      ["Game data and art",    () => true],
    ];

    async function loadTools() {
      try {
        const res = await fetch(`${API}/api/tools`);
        tools = (await res.json()).tools;
        document.getElementById("toolCount").innerText = `${tools.length} tools — local, no AI`;
        renderToolList();
      } catch {
        document.getElementById("toolCount").innerText = "server offline";
        setOutput("Could not reach the local server.\n\nStart it with:\n\n    npm run web\n\nthen open http://localhost:3001");
      }
    }

    function renderToolList() {
      const q = document.getElementById("toolFilter").value.trim().toLowerCase();
      const shown = tools.filter((t) =>
        !q || t.name.toLowerCase().includes(q) || t.title.toLowerCase().includes(q));

      const list = document.getElementById("toolList");
      list.innerHTML = "";
      const used = new Set();

      for (const [label, match] of GROUPS) {
        const group = shown.filter((t) => !used.has(t.name) && match(t.name));
        group.forEach((t) => used.add(t.name));
        if (!group.length) continue;

        const h = document.createElement("div");
        h.className = "section-title";
        h.innerText = label;
        list.appendChild(h);

        for (const t of group) {
          const div = document.createElement("div");
          div.className = "item-card" + (current?.name === t.name ? " active" : "");
          div.innerHTML = `<div class="tname"></div><div class="ttitle"></div>`;
          div.querySelector(".tname").innerText = t.name;
          div.querySelector(".ttitle").innerText = t.title;
          div.onclick = () => selectTool(t);
          list.appendChild(div);
        }
      }

      if (!shown.length) {
        list.innerHTML = '<div style="padding:12px;color:#777;font-size:12px;">No tools match that filter.</div>';
      }
    }

    document.getElementById("toolFilter").addEventListener("input", renderToolList);

    function selectTool(tool) {
      current = tool;
      document.getElementById("currentTool").innerText = tool.name;
      document.getElementById("tool-desc").innerText = tool.description;
      document.getElementById("runBtn").disabled = false;
      setStatus("");
      renderToolList();

      const fields = document.getElementById("fields");
      fields.innerHTML = "";

      if (!tool.fields.length) {
        fields.innerHTML = '<div class="hint">No arguments — just hit Run.</div>';
      }

      for (const f of tool.fields) {
        const wrap = document.createElement("div");
        wrap.className = "field" + (f.kind === "boolean" ? " check" : "");

        const label = document.createElement("label");
        label.htmlFor = `f_${f.name}`;
        label.innerHTML = `${f.name} ` + (f.optional
          ? '<span class="opt">(optional)</span>'
          : '<span class="req">*</span>');

        let input;
        if (f.kind === "enum") {
          input = document.createElement("select");
          if (f.optional) input.appendChild(new Option("(default)", ""));
          for (const o of f.options) input.appendChild(new Option(o, o));
        } else {
          input = document.createElement("input");
          input.type = f.kind === "number" ? "number" : f.kind === "boolean" ? "checkbox" : "text";
          if (f.kind !== "boolean") {
            input.placeholder = f.optional ? "optional" : "required";
            input.addEventListener("keydown", (e) => { if (e.key === "Enter") runTool(); });
          }
        }
        input.id = `f_${f.name}`;
        input.dataset.field = f.name;
        input.dataset.kind = f.kind;

        if (f.kind === "boolean") { wrap.appendChild(input); wrap.appendChild(label); }
        else { wrap.appendChild(label); wrap.appendChild(input); }

        if (f.description) {
          const hint = document.createElement("div");
          hint.className = "hint";
          hint.innerText = f.description;
          wrap.appendChild(hint);
        }
        fields.appendChild(wrap);
      }

      const first = fields.querySelector("input[type=text], input[type=number], select");
      if (first) first.focus();
      setOutput("");
    }

    function collectArgs() {
      const args = {};
      for (const el of document.querySelectorAll("#fields [data-field]")) {
        args[el.dataset.field] = el.dataset.kind === "boolean" ? el.checked : el.value;
      }
      return args;
    }

    async function runTool() {
      if (!current) return;
      const btn = document.getElementById("runBtn");
      btn.disabled = true;
      setStatus("running…");
      setOutput("");

      try {
        const res = await fetch(`${API}/api/call`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tool: current.name, args: collectArgs() }),
        });
        const data = await res.json();

        if (!res.ok || data.error) {
          setStatus("error", true);
          setOutput(data.error || `HTTP ${res.status}`);
        } else {
          setStatus(`${data.ms} ms${data.isError ? " — tool reported an error" : ""}`, data.isError);
          setOutput(data.text || "(no output)");
        }
      } catch (err) {
        setStatus("request failed", true);
        setOutput(`Could not reach the server.\n\n${err.message}`);
      } finally {
        btn.disabled = false;
      }
    }

    function setOutput(txt) {
      if (!editor) return;
      const lang = current?.name === "wow_ui_read_file" ? guessLang() : "plaintext";
      monaco.editor.setModelLanguage(editor.getModel(), lang);
      editor.setValue(txt);
      editor.setScrollTop(0);
    }

    function guessLang() {
      const p = (document.getElementById("f_path")?.value || "").toLowerCase();
      if (p.endsWith(".xml") || p.endsWith(".toc")) return "xml";
      return "lua";
    }

    function setStatus(msg, isErr = false) {
      const s = document.getElementById("status");
      s.innerText = msg;
      s.className = isErr ? "err" : "";
    }

    function copyOutput() {
      if (!editor) return;
      navigator.clipboard.writeText(editor.getValue());
      const toast = document.getElementById("toast");
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 1600);
    }
  </script>
</body>
</html>
